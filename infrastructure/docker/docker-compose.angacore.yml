# infrastructure/docker/docker-compose.angacore.yml
services:
  web:
    build:
      context: ../../app
      dockerfile: Dockerfile
    container_name: angacore_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - CRUST_WEBHOOK_URL=${CRUST_WEBHOOK_URL}
      - OPS_PASSWORD=${OPS_PASSWORD}
      - OPS_SESSION_TOKEN=${OPS_SESSION_TOKEN}
      - DB_HOST=angacore_db
      - DB_PORT=5432
      - DB_NAME=angacore
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - angacore_net

  db:
    image: postgres:15-alpine
    container_name: angacore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: angacore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - angacore_pgdata:/var/lib/postgresql/data
    networks:
      - angacore_net

volumes:
  angacore_pgdata:

networks:
  angacore_net:
    driver: bridge